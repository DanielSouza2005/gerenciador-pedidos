spring.application.name=gerenciador-pedidos

spring.datasource.url=jdbc:postgresql://${DB_GERENCIADOR_HOST}:${DB_GERENCIADOR_PORT}/${DB_GERENCIADOR_NAME}
spring.datasource.username=${DB_GERENCIADOR_USER}
spring.datasource.password=${DB_GERENCIADOR_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
hibernate.dialect=org.hibernate.dialect.HSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true
